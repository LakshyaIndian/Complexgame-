<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c1118" />
  <meta name="description" content="Future Readiness Simulator 2050 — a serious scenario strategy PWA about resilience, uncertainty, and long-horizon survival." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Future Readiness Simulator 2050</title>
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Future Readiness Simulator</p>
        <h1>2050</h1>
      </div>
      <button id="install-btn" class="ghost-button hidden" type="button">Install</button>
    </header>

    <main id="app" aria-live="polite">
      <section class="screen">
        <section class="panel hero">
          <p class="eyebrow">Loading</p>
          <h2>Booting simulator</h2>
          <p>The app shell is loading. If this takes more than a moment, the page will show a recovery panel automatically.</p>
        </section>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-nav="home" class="nav-button active">Home</button>
      <button data-nav="history" class="nav-button">History</button>
      <button data-nav="help" class="nav-button">Help</button>
      <button data-nav="settings" class="nav-button">Settings</button>
    </nav>
  </div>

  <template id="toast-template">
    <div class="toast"></div>
  </template>

  <script type="module">
    const bootVersion = "2026-04-19-boot-2";
    const appRoot = document.getElementById("app");

    function renderBootError(error) {
      console.error("App boot failed", error);
      if (!appRoot) return;
      appRoot.innerHTML = `
        <section class="screen">
          <section class="panel hero">
            <p class="eyebrow">Startup recovery</p>
            <h2>The simulator failed to start cleanly</h2>
            <p>This usually means stale cached files or a module load failure. Use the actions below to recover.</p>
          </section>
          <section class="panel">
            <div class="button-row">
              <button type="button" class="primary-button" id="boot-reload">Reload App</button>
              <button type="button" class="secondary-button" id="boot-clear">Clear Local Save</button>
            </div>
            <p class="footer-note" style="margin-top: 12px;">Open the browser console for the exact startup error.</p>
          </section>
        </section>
      `;

      document.getElementById("boot-reload")?.addEventListener("click", () => {
        window.location.reload();
      });

      document.getElementById("boot-clear")?.addEventListener("click", () => {
        try {
          localStorage.removeItem("frs2050_state_v1");
        } catch (storageError) {
          console.error("Failed to clear local save", storageError);
        }
        window.location.reload();
      });
    }

    import(`./js/app.js?v=${bootVersion}`).catch(renderBootError);
  </script>
</body>
</html>
