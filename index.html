<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c1118" />
  <meta name="description" content="Future Readiness Simulator 2050 — a serious scenario strategy PWA about resilience, uncertainty, and long-horizon survival." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Future Readiness Simulator 2050</title>
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Future Readiness Simulator</p>
        <h1>2050</h1>
      </div>
      <button id="install-btn" class="ghost-button hidden" type="button">Install</button>
    </header>

    <main id="app" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-nav="home" class="nav-button active">Home</button>
      <button data-nav="history" class="nav-button">History</button>
      <button data-nav="help" class="nav-button">Help</button>
      <button data-nav="settings" class="nav-button">Settings</button>
    </nav>
  </div>

  <template id="toast-template">
    <div class="toast"></div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
